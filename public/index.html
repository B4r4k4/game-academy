<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أكاديمية الألعاب · Game Academy</title>
  <meta name="description" content="أكاديمية عملية لتصميم الألعاب وبنائها — Learn game design and development in Arabic and English.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800&family=Anton&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/thmanyah.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/cinematic.css">
  <link rel="stylesheet" href="/css/v2.css">
  <link rel="stylesheet" href="/css/film.css">
  <link rel="stylesheet" href="/css/fit.css">
  <link rel="stylesheet" href="/css/videos.css">
  <link rel="stylesheet" href="/css/studio.css">
  <link rel="stylesheet" href="/css/lab.css">
  <link rel="stylesheet" href="/css/quest.css">
</head>
<body>
  <a class="skip" id="skip" href="#main">Skip</a>

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">▶</span>
      <span class="brand-text" id="brandText"></span>
    </a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="top-right" id="topRight"></div>
  </header>
  <div class="announce" id="announce" hidden></div>

  <main id="main" tabindex="-1">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-learn"></section>
    <section class="view" id="view-module"></section>
    <section class="view" id="view-lab"></section>
    <section class="view" id="view-videos"></section>
    <section class="view" id="view-gallery"></section>
    <section class="view" id="view-studio"></section>
    <section class="view" id="view-games"></section>
    <section class="view" id="view-profile"></section>
    <section class="view" id="view-login"></section>
    <section class="view" id="view-register"></section>
    <section class="view" id="view-account"></section>
    <section class="view" id="view-admin"></section>
    <div class="boot-loader" aria-hidden="true"><span class="brand-mark">▶</span></div>
  </main>

  <footer class="footer"><p id="footerText"></p></footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
    <button class="icon-btn lb-close" id="lbClose">✕</button>
    <div class="lb-inner">
      <div class="lb-img"><img id="lbImg" alt=""></div>
      <aside class="lb-side">
        <h3 id="lbTitle"></h3>
        <div class="tags" id="lbTags"></div>
        <h4 id="lbWhat"></h4>
        <ul id="lbNotes"></ul>
      </aside>
    </div>
  </div>

  <div class="curtain" id="curtain" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="levelup" id="levelup" hidden aria-live="assertive"><div class="lu-rays"></div><div class="lu-card"><span id="luText"></span><b id="luLevel">2</b><em id="luTitle"></em></div></div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/genre-lab.js"></script>
  <script src="/js/lab.js"></script>
  <script src="/js/studio-assets.js"></script>
  <script src="/js/studio.js"></script>
  <script src="/js/games.js"></script>
  <script src="/js/quest.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
