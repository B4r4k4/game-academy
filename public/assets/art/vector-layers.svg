    <g transform="translate(330 230)"><g class="float" style="animation-delay:-2.4s;animation-duration:4s"><g transform="skewX(-30) scale(1 .55)"><rect x="-200" y="-110" width="400" height="220" rx="16" fill="#2a2058" opacity=".9" stroke="#fff" stroke-opacity=".5" stroke-width="3"/><circle cx="60" cy="0" r="30" fill="#ffcf5a"/><circle cx="130" cy="0" r="30" fill="#ffcf5a"/><rect x="-180" y="-80" width="140" height="24" rx="12" fill="#ff5d6b"/></g></g><text x="270" y="6" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="start" >Coins &amp; UI</text></g>
