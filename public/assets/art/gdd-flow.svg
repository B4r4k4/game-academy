      <text x="0" y="-20" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="700" fill="#ffcf5a" text-anchor="middle" letter-spacing="3" >01</text><text x="0" y="12" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" >Concept &amp; Pitch</text><text x="-90" y="56" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Hook &amp; fantasy</text><text x="-90" y="84" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Target player</text><text x="-90" y="112" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Genre &amp; platform</text></g></g><g transform="translate(450 380)"><g class="bob" style="animation-delay:-0.7s;animation-duration:3s"><rect x="-125" y="-190" width="250" height="330" rx="24" fill="#221a52" stroke="#2fd3c4" stroke-width="3" filter="url(#drop)"/><circle cx="0" cy="-110" r="52" fill="#2fd3c4" /><g transform="translate(0 -110)"><rect x="-32" y="-16" width="64" height="34" rx="17" fill="#fff"/><path d="M-20 1 h12 M-14 -5 v12" stroke="#2fd3c4" stroke-width="4"/><circle cx="12" cy="-3" r="4" fill="#2fd3c4"/><circle cx="20" cy="5" r="4" fill="#2fd3c4"/></g>
      <text x="0" y="-20" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="700" fill="#2fd3c4" text-anchor="middle" letter-spacing="3" >02</text><text x="0" y="12" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" >Gameplay &amp; Mechanics</text><text x="-90" y="56" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Core loop</text><text x="-90" y="84" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Systems</text><text x="-90" y="112" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Win / lose</text></g></g><g transform="translate(750 380)"><g class="bob" style="animation-delay:-1.4s;animation-duration:3s"><rect x="-125" y="-190" width="250" height="330" rx="24" fill="#221a52" stroke="#ff6fb5" stroke-width="3" filter="url(#drop)"/><circle cx="0" cy="-110" r="52" fill="#ff6fb5" /><g transform="translate(0 -110)"><path d="M-26 22 L4 -8 L14 2 L-16 32Z" fill="#fff"/><path d="M4 -8 L20 -24 L30 -14 L14 2Z" fill="#ffd0e6"/><path d="M18 18 v-34 l18 -4 v30" stroke="#fff" stroke-width="5" fill="none"/><circle cx="14" cy="20" r="6" fill="#fff"/></g>
      <text x="0" y="-20" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="700" fill="#ff6fb5" text-anchor="middle" letter-spacing="3" >03</text><text x="0" y="12" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" >Art &amp; Sound</text><text x="-90" y="56" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Style guide</text><text x="-90" y="84" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Palette</text><text x="-90" y="112" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Audio mood</text></g></g><g transform="translate(1050 380)"><g class="bob" style="animation-delay:-2.1s;animation-duration:3s"><rect x="-125" y="-190" width="250" height="330" rx="24" fill="#221a52" stroke="#8b7bff" stroke-width="3" filter="url(#drop)"/><circle cx="0" cy="-110" r="52" fill="#8b7bff" /><g transform="translate(0 -110)"><g transform="translate(0 0)"><g class="spin" style="animation-delay:0s;animation-duration:8s"><path d="M30 0L29.5 5.2L20.7 7.5L19.1 11L23 19.3L19.3 23L11 19.1L7.5 20.7L5.2 29.5L0 30L-3.8 21.7L-7.5 20.7L-15 26L-19.3 23L-16.9 14.1L-19.1 11L-28.2 10.3L-29.5 5.2L-22 0L-21.7 -3.8L-28.2 -10.3L-26 -15L-16.9 -14.1L-14.1 -16.9L-15 -26L-10.3 -28.2L-3.8 -21.7L0 -22L5.2 -29.5L10.3 -28.2L11 -19.1L14.1 -16.9L23 -19.3L26 -15L20.7 -7.5L21.7 -3.8Z" fill="#fff"/><circle r="9" fill="#8b7bff"/></g></g></g>
      <text x="0" y="-20" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="700" fill="#8b7bff" text-anchor="middle" letter-spacing="3" >04</text><text x="0" y="12" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" >Engine &amp; Tools</text><text x="-90" y="56" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Engine choice</text><text x="-90" y="84" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Pipelines</text><text x="-90" y="112" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif" font-size="16" font-weight="500" fill="#fff" text-anchor="start" opacity="0.85" >• Build targets</text></g></g>
